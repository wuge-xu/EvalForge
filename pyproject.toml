[build-system]
requires = ["setuptools>=83,<84"]
build-backend = "setuptools.build_meta"

[project]
name = "evalforge"
version = "0.1.0"
description = "RAG and Agent evaluation, experiment tracking, and regression platform"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi[standard]>=0.139,<0.140",
    "pydantic-settings>=2.14,<2.15",
    "sqlalchemy>=2.0,<2.1",
    "psycopg[binary]>=3.2,<3.4",
    "alembic>=1.18,<1.19",
]

[project.scripts]
evalforge-api = "evalforge.__main__:main"

[project.optional-dependencies]
dev = [
    "httpx2>=2.7,<2.8",
    "mypy>=2.3,<2.4",
    "pytest>=9.1,<9.2",
    "ruff>=0.16,<0.17",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["evalforge"]
