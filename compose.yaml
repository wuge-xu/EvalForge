services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17-bookworm
    container_name: evalforge-postgres
    environment:
      POSTGRES_DB: evalforge
      POSTGRES_USER: evalforge
      POSTGRES_PASSWORD: evalforge_dev
    ports:
      - "55432:5432"
    volumes:
      - evalforge_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evalforge -d evalforge"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  evalforge_postgres_data:
